name: Release
# Publishes @datawebot/cli to npm when a v<version> tag is pushed. npm trusts this workflow
# (Trusted Publisher on npmjs.com: datawebot/datawebot-cli, release.yml), so no token is stored.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run test:package
      - run: npm publish
